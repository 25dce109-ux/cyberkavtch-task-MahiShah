<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | CyberKavach</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="app-shell">
  <div class="sidebar" id="sidebar">
    <div class="brand-sidebar"><a href="index.html"><img src="assets/logo/logo.svg" loading="lazy" alt="CyberKavach logo"/> CyberKavach</a></div>
    <nav class="sidebar-nav">
      <a href="pages/dashboard-faculty.html">Dashboard</a>
      <a href="approvals.html">Approvals</a>
      <a href="events.html">Events</a>
      <a href="certificates.html">Certificates</a>
      <a href="attendance.html">Attendance</a>
      <a href="rewards.html">Rewards</a>
      <a href="analytics.html">Analytics</a>
      <a href="settings.html" class="active">Settings</a>
      <a href="login.html" class="logout-link">Logout</a>
    </nav>
  </div>
  <div class="main-content">
    <header class="app-topbar">
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      <h1>Settings</h1>
    </header>

    <section class="settings-grid">
      <div class="glass-card settings-card">
        <h2>Theme Preferences</h2>
        <button class="btn btn-primary" id="enableDark">Dark Mode</button>
        <button class="btn btn-outline" id="enableLight">Light Mode</button>
      </div>
      <div class="glass-card settings-card">
        <h2>Notification Preferences</h2>
        <label class="checkbox-label"><input type="checkbox" id="notifEmail" checked /> Email notifications</label>
        <label class="checkbox-label"><input type="checkbox" id="notifPush" checked /> Push alerts</label>
      </div>
      <div class="glass-card settings-card">
        <h2>Account Details</h2>
        <input id="accountName" type="text" placeholder="Name" />
        <input id="accountEmail" type="email" placeholder="Email" />
        <button class="btn btn-primary" id="saveAccount">Save Details</button>
      </div>
      <div class="glass-card settings-card">
        <h2>Change Password</h2>
        <input id="currentPassword" type="password" placeholder="Current password" />
        <input id="newPassword" type="password" placeholder="New password" />
        <button class="btn btn-primary" id="updatePassword">Update Password</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>
  <button class="back-to-top" id="backTop">↑</button>
  <script src="js/storage.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
