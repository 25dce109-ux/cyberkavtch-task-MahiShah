<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | CyberKavach</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-card glass-card">
      <div class="auth-brand">
        <h1><img src="assets/logo/logo.svg" loading="lazy" alt="logo" style="height:36px;vertical-align:middle;margin-right:8px;">CyberKavach</h1>
        <p>Login to continue to your club dashboard.</p>
      </div>
      <form id="loginForm" class="auth-form">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required />

        <label for="loginPassword">Password</label>
        <div class="password-field">
          <input type="password" id="loginPassword" placeholder="********" required />
          <button type="button" class="password-toggle" id="toggleLoginPassword">👁</button>
        </div>

        <label for="loginRole">Role</label>
        <select id="loginRole" required>
          <option value="">Select Role</option>
          <option value="Faculty Coordinator">Faculty Coordinator</option>
          <option value="Student Coordinator">Student Coordinator</option>
          <option value="Tech Coordinator">Tech Coordinator</option>
          <option value="Content Coordinator">Content Coordinator</option>
          <option value="Social Media Coordinator">Social Media Coordinator</option>
          <option value="Club Member">Club Member</option>
          <option value="Student/Guest">Student/Guest</option>
        </select>

        <div class="form-row space-between">
          <label class="checkbox-label"><input type="checkbox" id="rememberMe" /> Remember me</label>
          <a href="#" class="link-small">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
        <p class="auth-note">New to CyberKavach? <a href="register.html">Create an account</a></p>
        <p class="auth-error" id="loginError"></p>
      </form>
    </div>
  </div>

  <button class="back-to-top" id="backTop">↑</button>
  <div class="toast" id="toast"></div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/permissions.js"></script>
</body>
</html>
