<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance | CyberKavach</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="app-shell">
  <div class="sidebar" id="sidebar">
    <div class="brand-sidebar"><a href="index.html"><img src="assets/logo/logo.svg" loading="lazy" alt="CyberKavach logo"/> CyberKavach</a></div>
    <nav class="sidebar-nav">
      <a href="pages/dashboard-faculty.html">Dashboard</a>
      <a href="approvals.html">Approvals</a>
      <a href="events.html">Events</a>
      <a href="certificates.html">Certificates</a>
      <a href="attendance.html" class="active">Attendance</a>
      <a href="rewards.html">Rewards</a>
      <a href="analytics.html">Analytics</a>
      <a href="settings.html">Settings</a>
      <a href="login.html" class="logout-link">Logout</a>
    </nav>
  </div>
  <div class="main-content">
    <header class="app-topbar">
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      <h1>Attendance Management</h1>
    </header>

    <section class="dashboard-grid">
      <article class="dashboard-card glass-card">
        <h3>Checked In</h3>
        <p class="metric" id="checkedInCount">26</p>
      </article>
      <article class="dashboard-card glass-card">
        <h3>Pending Arrival</h3>
        <p class="metric" id="pendingCount">14</p>
      </article>
      <article class="dashboard-card glass-card">
        <h3>Checked Out</h3>
        <p class="metric" id="checkedOutCount">8</p>
      </article>
      <article class="dashboard-card glass-card">
        <h3>Total Participants</h3>
        <p class="metric" id="totalParticipants">48</p>
      </article>
    </section>

    <section class="form-card glass-card">
      <h2>QR Attendance Simulation</h2>
      <div class="attendance-controls">
        <button class="btn btn-primary" id="checkInBtn">Check In</button>
        <button class="btn btn-outline" id="checkOutBtn">Check Out</button>
      </div>
      <button class="btn btn-secondary" id="exportAttendance">Export CSV</button>
    </section>

    <section class="table-section">
      <div class="card-table glass-card">
        <div class="card-header"><h2>Attendance Log</h2></div>
        <table id="attendanceTable">
          <thead><tr><th>Name</th><th>Event</th><th>Check In</th><th>Check Out</th><th>Status</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>
  <button class="back-to-top" id="backTop">↑</button>
  <script src="js/storage.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
